# `cargo deny check`: licences, advisories and duplicate dependencies.
#
# The default build has no dependencies (D-001); the `oms` feature brings the RustCrypto
# AES modes and `zeroize`. `all-features` makes this check cover them.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
